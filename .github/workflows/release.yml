name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dw-desktop/package-lock.json

      - name: Install dependencies
        working-directory: dw-desktop
        run: npm ci

      - name: Build (x64 + arm64)
        working-directory: dw-desktop
        run: npm run build:win -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dw-desktop/dist/*.exe

  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dw-desktop/package-lock.json

      - name: Install dependencies
        working-directory: dw-desktop
        run: npm ci

      - name: Build (universal — Intel + Apple Silicon)
        working-directory: dw-desktop
        run: npm run build:mac -- --publish never

      - name: Ad-hoc sign (fixes Team ID mismatch on macOS 26+)
        run: |
          DMG=$(ls dw-desktop/dist/*.dmg | head -1)
          hdiutil attach "$DMG" -mountpoint /Volumes/DWDesktop -nobrowse -quiet
          cp -R "/Volumes/DWDesktop/DW Desktop.app" /tmp/DWDesktop.app
          hdiutil detach /Volumes/DWDesktop -quiet
          codesign --deep --force --sign - /tmp/DWDesktop.app
          hdiutil create -volname "DW Desktop" -srcfolder /tmp/DWDesktop.app -ov -format UDZO /tmp/DWDesktop-signed.dmg
          mv /tmp/DWDesktop-signed.dmg "$DMG"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mac
          path: dw-desktop/dist/*.dmg

  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dw-desktop/package-lock.json

      - name: Install dependencies
        working-directory: dw-desktop
        run: npm ci

      - name: Build
        working-directory: dw-desktop
        run: npm run build:linux -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dw-desktop/dist/*.AppImage
            dw-desktop/dist/*.deb

  release:
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
