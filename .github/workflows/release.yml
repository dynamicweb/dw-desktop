name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dw-desktop/package-lock.json

      - name: Install dependencies
        working-directory: dw-desktop
        run: npm ci

      - name: Build (x64 + arm64)
        working-directory: dw-desktop
        run: npm run build:win

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dw-desktop/dist/*.exe

  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dw-desktop/package-lock.json

      - name: Install dependencies
        working-directory: dw-desktop
        run: npm ci

      - name: Build (universal — Intel + Apple Silicon)
        working-directory: dw-desktop
        run: npm run build:mac

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mac
          path: dw-desktop/dist/*.dmg

  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dw-desktop/package-lock.json

      - name: Install dependencies
        working-directory: dw-desktop
        run: npm ci

      - name: Build
        working-directory: dw-desktop
        run: npm run build:linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dw-desktop/dist/*.AppImage
            dw-desktop/dist/*.deb

  release:
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
